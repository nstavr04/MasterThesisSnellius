[project]
name = "thesiscode"
version = "0.1.0"
description = "Add your description here"
authors = [{ name = "Nikolas Stavrou", email = "n.stavrou@students.uu.nl" }]
readme = "README.md"
requires-python = "==3.11.3"

# I am using h5py 3.12.1 so it is compatible with the modules on the hpc
# old tensorboard version:  "tensorboard~=2.13.0"
# pinning torch with +cu121 has issues. removing the +cu121 seems to work okay
# using numpy 1.X seems to work, using 2.X doesn't
dependencies = [
    "tqdm~=4.65.0",
    "torch==2.2.2",
    "torchvision==0.17.2",
    "torchsummary>=1.5.1",
    "fastapi~=0.80",
    "lightning~=2.2.1",
    "tensorboard~=2.18.0",
    "pandas~=1.5.3",
    "tables>=3.9.2",
    "matplotlib>=3.8.3",
    "h5py>=3.12.1",
    "numpy==1.26.4",
]

[tool.uv.pip]
find-links = ["https://download.pytorch.org/whl/cu121"]
